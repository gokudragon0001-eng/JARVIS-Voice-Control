
      - name: Find Gradle Wrapper
        run: |
          echo "Searching for gradlew..."
          find . -name gradlew -type f

      - name: Build Debug APK
        run: |
          WRAPPER=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew file not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
